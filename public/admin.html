
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coupon Verification · aaboron.uss</title>
<style>
body {
  margin: 0; padding: 24px 16px;
  background: #f7f4e9; color: #29352b;
  font-family: Arial, sans-serif;
}
main {
  max-width: 430px; margin: 50px auto;
  background: #fffdf7; padding: 28px;
  border: 1px solid #dfe3d5;
}
.brand {
  text-align: center; letter-spacing: 3px;
  color: #2f4432; margin-bottom: 32px;
}
h1 { font-size: 25px; font-weight: 500; }
p { line-height: 1.6; color: #6e786a; }
label { display: block; margin: 18px 0 7px; }
input, button {
  box-sizing: border-box; width: 100%;
  padding: 13px; font-size: 15px;
}
input { border: 1px solid #cbd4bd; background: white; }
button {
  margin-top: 18px; border: 0;
  background: #536b50; color: white;
  cursor: pointer;
}
button:disabled { opacity: .6; cursor: wait; }
#result {
  display: none; margin-top: 22px;
  padding: 16px; white-space: pre-line;
  line-height: 1.6; overflow-wrap: anywhere;
}
.ok { background: #e8efe3; color: #254b2b; }
.bad { background: #f8e8e2; color: #873a2b; }
.small { font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="brand">aaboron.uss</div>
  <h1>Coupon verification</h1>
  <p>Enter your admin secret and the customer's coupon code.</p>

  <form id="form">
    <label for="secret">Admin secret</label>
    <input id="secret" type="password"
      autocomplete="current-password" required>

    <label for="code">Customer coupon code</label>
    <input id="code" placeholder="AAB-XXXXXX-XXXXXX"
      autocapitalize="characters" required>

    <button id="submit" type="submit">Verify & Redeem</button>
  </form>

  <div id="result" role="status" aria-live="polite"></div>
  <p class="small">
    Warning: a successful verification immediately marks the
    coupon as redeemed. Use this only when accepting the coupon
    for a purchase.
  </p>
</main>

<script>
const form = document.getElementById("form");
const secret = document.getElementById("secret");
const code = document.getElementById("code");
const button = document.getElementById("submit");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  button.textContent = "Checking...";
  result.style.display = "block";
  result.className = "";
  result.textContent = "Verifying coupon...";

  try {
    const response = await fetch("/api/redeem", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + secret.value
      },
      body: JSON.stringify({ code: code.value.trim() })
    });

    const data = await response.json();

    if (response.ok && data.valid) {
      result.className = "ok";
      result.textContent =
        "✓ COUPON ACCEPTED\n\n" +
        data.discount + "% discount\n" +
        "Code: " + data.code +
        "\n\nThis coupon is now marked as redeemed.";
      code.value = "";
    } else {
      result.className = "bad";
      result.textContent =
        "✕ COUPON REJECTED\n\n" +
        (data.message || data.error || "Verification failed.");
    }
  } catch (_) {
    result.className = "bad";
    result.textContent =
      "Network error. Check your connection and try again.";
  } finally {
    button.disabled = false;
    button.textContent = "Verify & Redeem";
  }
});
</script>
</body>
</html>
